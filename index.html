<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Geometry Dash — Upgraded Preview</title>
<style>
  html,body{height:100%; margin:0; background:#0b1220; font-family:Inter,system-ui,Arial;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:18px;box-sizing:border-box;}
  canvas{background:linear-gradient(180deg,#071225,#0b1220); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,0.6); touch-action:none;}
  .note{position:fixed;left:18px;bottom:18px;color:#a9c0d6;font-size:13px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="450" aria-label="Upgraded Geometry Dash preview"></canvas>
</div>
<div class="note">Space / ↑ / Click / Tap to jump • P = Pause • R = Restart</div>

<script>
/* Upgraded Geometry Dash Preview
 - Far-ahead obstacle visibility (telegraphs + shadows)
 - Multiple obstacle types: ground blocks, tall spikes, flying blocks, moving obstacles
 - Smooth physics, speed ramp, particles, restart/pause, mobile friendly
 - Single-file — paste into ChatGPT preview or open as index.html
*/

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = canvas.width, H = canvas.height;

function fit() {
  const maxW = Math.min(window.innerWidth - 36, 1200);
  const w = Math.max(600, maxW);
  const aspect = 900/450;
  canvas.width = Math.round(w);
  canvas.height = Math.round(w / aspect);
  W = canvas.width; H = canvas.height;
}
fit();
window.addEventListener('resize', fit);

// Game state
let state = {
  playing: true,
  paused: false,
  gameOver: false,
  lastTime: performance.now(),
  speedBase: 5,           // pixels per frame base (will scale)
  speedMult: 1.0,
  distance: 0,
  score: 0,
  high: Number(localStorage.getItem('gd_high') || 0),
  obstacles: [],
  particles: [],
  spawnTimer: 0,
  spawnInterval: 1000,    // ms
  telegraphDistance: 620, // how far ahead obstacles spawn (big!)
  gravity: 0.7,
  jumpVel: -13,
  beat: 0
};

// Player
const player = {
  x: Math.round(W * 0.14),
  w: Math.round(H * 0.085),
  h: Math.round(H * 0.085),
  y: 0,
  vy: 0,
  grounded: true,
  color: '#ffd14d'
};

function resetPlayer() {
  player.h = Math.round(H * 0.085);
  player.w = player.h;
  player.x = Math.round(W * 0.14);
  player.y = H - groundH() - player.h;
  player.vy = 0;
  player.grounded = true;
}
function groundH(){ return Math.round(H * 0.12); }
resetPlayer();

// Input
function doJump(){
  if(state.gameOver) return;
  if(player.grounded){
    player.vy = state.jumpVel;
    player.grounded = false;
    spawnJumpParticles();
    playBeep(400, 0.06);
  } else {
    // small coyote forgiveness: allow tiny extra mid-air correction (not double jump)
  }
}
window.addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); doJump(); }
  if(e.code === 'KeyP') togglePause();
  if(e.code === 'KeyR') restart();
});
canvas.addEventListener('pointerdown', e => { doJump(); });

// Pause / Restart
function togglePause(){
  state.paused = !state.paused;
  if(!state.paused){ state.lastTime = performance.now(); requestAnimationFrame(loop); }
}
function restart(){
  state.obstacles = [];
  state.particles = [];
  state.spawnTimer = 0;
  state.spawnInterval = 1000;
  state.speedMult = 1;
  state.distance = 0;
  state.score = 0;
  state.gameOver = false;
  state.paused = false;
  resetPlayer();
  playBeep(200, 0.08);
  state.lastTime = performance.now();
  requestAnimationFrame(loop);
}

// Obstacles: types -> 'block' (ground), 'tall' (tall ground), 'spike', 'fly' (air), 'move' (moving horizontally)
function spawnObstacleType() {
  // choose types with weights
  const r = Math.random();
  if (r < 0.45) return 'block';
  if (r < 0.6) return 'tall';
  if (r < 0.78) return 'spike';
  if (r < 0.9) return 'fly';
  return 'move';
}

function spawnObstacle() {
  const type = spawnObstacleType();
  const gap = randInt(40, 120); // horizontal gap (unused here but could be used to space)
  const baseX = W + 100 + randInt(0, 200); // spawn further out for visibility
  if(type === 'block') {
    const size = randInt(player.w * 0.8, player.w * 1.6);
    const h = size;
    state.obstacles.push({
      type:'block', x: baseX, y: H - groundH() - h, w: size, h: h
    });
  } else if(type === 'tall') {
    const w = randInt(player.w * 0.8, player.w * 1.2);
    const h = randInt(player.h * 1.6, player.h * 2.8);
    state.obstacles.push({ type:'tall', x: baseX, y: H - groundH() - h, w:w, h:h });
  } else if(type === 'spike') {
    const w = randInt(player.w*0.6, player.w*1.0);
    const h = w * 1.2;
    state.obstacles.push({ type:'spike', x: baseX, y: H - groundH() - h, w:w, h:h });
  } else if(type === 'fly') {
    const w = randInt(player.w*0.8, player.w*1.2);
    const h = randInt(player.h*0.5, player.h*0.9);
    const y = H - groundH() - player.h - randInt(player.h*1, player.h*3) - h;
    state.obstacles.push({ type:'fly', x: baseX, y: y, w:w, h:h, dir: Math.random()<0.5? -1:1, range: randInt(40,140), baseY: y });
  } else if(type === 'move') {
    const w = randInt(player.w*0.8, player.w*1.4);
    const h = randInt(player.h*0.8, player.h*1.8);
    const y = H - groundH() - h;
    state.obstacles.push({ type:'move', x: baseX, y: y - randInt(0, 0), w:w, h:h, vx: -randInt(1,3) });
  }
}

// Utils
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function rectsCollide(a,b){
  return !(a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h);
}

// Particles
function spawnJumpParticles(){
  for(let i=0;i<8;i++){
    state.particles.push({
      x: player.x + player.w*0.5 + randInt(-4,4),
      y: player.y + player.h,
      vx: (Math.random()-0.5)*4,
      vy: -Math.random()*4 - 1,
      life: randInt(40,80),
      size: randInt(2,6),
      col: 'rgba(255,210,80,0.9)'
    });
  }
}
function spawnCrashParticles(cx, cy){
  for(let i=0;i<26;i++){
    state.particles.push({
      x: cx,
      y: cy,
      vx: (Math.random()-0.5)*8,
      vy: (Math.random()-0.5)*8,
      life: randInt(40,100),
      size: randInt(3,7),
      col: `rgba(255,${randInt(60,170)},${randInt(30,60)},1)`
    });
  }
}

// Sounds using simple oscillator (may be blocked in some sandboxes but often works)
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; }
}
function playBeep(freq, dur=0.05){
  ensureAudio();
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.linearRampToValueAtTime( dur>0?0.08:0.06, now + 0.001 );
  o.start(now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.stop(now + dur + 0.02);
}

// Game over
function setGameOver(){
  if(state.gameOver) return;
  state.gameOver = true;
  state.paused = true;
  playBeep(120, 0.18);
  spawnCrashParticles(player.x + player.w*0.5, player.y + player.h*0.5);
  if(state.score > state.high){
    state.high = state.score;
    localStorage.setItem('gd_high', String(state.high));
  }
}

// Loop
function loop(now) {
  if(state.paused) return;
  const dt = Math.min(40, now - state.lastTime);
  state.lastTime = now;

  // ramp difficulty gently over time
  state.speedMult += dt * 0.000035;
  const speed = (state.speedBase) * state.speedMult;

  // update spawn timing: spawn farther apart as speed increases to keep fairness, but telegraphDistance helps
  state.spawnTimer += dt;
  const effectiveInterval = Math.max(520, state.spawnInterval / (1 + (state.speedMult - 1) * 0.8));
  if(state.spawnTimer > effectiveInterval){
    state.spawnTimer = 0;
    // spawn obstacles at telegraph distance ahead
    // We purposely create obstacles with x starting at W + telegraphDistance so player sees them early
    // But to keep variety, we offset randomly a bit.
    const tele = state.telegraphDistance + randInt(-60, 120);
    spawnObstacleAtX(W + tele);
  }

  // update obstacles
  for(let i = state.obstacles.length - 1; i >= 0; i--){
    const ob = state.obstacles[i];
    // moving obstacles update
    if(ob.type === 'move'){
      ob.x += ob.vx;
      if(ob.x < W*0.5) ob.vx = Math.abs(ob.vx); // bounce rightwards a bit
    }
    if(ob.type === 'fly'){
      // float up and down
      ob.baseY += 0; // keep
      ob.y += Math.sin((state.distance + ob.x) * 0.03) * 0.6;
    }
    // universal motion to the left based on game speed
    ob.x -= speed * (dt / 16.6); // normalized to ~60fps
    // cull off-screen
    if(ob.x + ob.w < -200) state.obstacles.splice(i,1);
  }

  // update player physics
  player.vy += state.gravity;
  player.y += player.vy;
  const groundY = H - groundH() - player.h;
  if(player.y >= groundY){
    player.y = groundY;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // collisions (AABB)
  const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
  for(const ob of state.obstacles){
    // special collision tweaks for spikes (narrow peak) -- approximate with rect for fairness
    let obRect = { x: ob.x, y: ob.y, w: ob.w, h: ob.h };
    if(rectsCollide(playerRect, obRect)){
      setGameOver();
    }
  }

  // update particles
  for(let i = state.particles.length - 1; i >= 0; i--){
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25; // gravity on particles
    p.life--;
    if(p.life <= 0) state.particles.splice(i,1);
  }

  // scoring = distance (rounded)
  state.distance += speed * (dt / 16.6);
  const dist = Math.floor(state.distance * 0.2);
  state.score = dist;

  render();

  // continue
  if(!state.paused) requestAnimationFrame(loop);
}

// spawn at specific x (telegraphed spawning)
function spawnObstacleAtX(startX){
  const type = spawnObstacleType();
  if(type === 'block') {
    const size = randInt(player.w * 0.8, player.w * 1.6);
    const h = size;
    state.obstacles.push({ type:'block', x: startX + randInt(-40,40), y: H - groundH() - h, w: size, h: h });
  } else if(type === 'tall') {
    const w = randInt(player.w * 0.8, player.w * 1.2);
    const h = randInt(player.h * 1.6, player.h * 2.6);
    state.obstacles.push({ type:'tall', x: startX + randInt(-40,40), y: H - groundH() - h, w:w, h:h });
  } else if(type === 'spike') {
    const w = randInt(Math.round(player.w*0.5), Math.round(player.w*1.0));
    const h = w * 1.3;
    state.obstacles.push({ type:'spike', x: startX + randInt(-40,40), y: H - groundH() - h, w:w, h:h });
  } else if(type === 'fly') {
    const w = randInt(player.w*0.8, player.w*1.2);
    const h = randInt(player.h*0.4, player.h*0.9);
    const y = H - groundH() - player.h - randInt(player.h*1, player.h*3) - h;
    state.obstacles.push({ type:'fly', x: startX + randInt(-40,40), y: y, w:w, h:h, baseY: y });
  } else if(type === 'move') {
    const w = randInt(player.w*0.9, player.w*1.6);
    const h = randInt(player.h*0.8, player.h*1.3);
    state.obstacles.push({ type:'move', x: startX + randInt(-40,40), y: H - groundH() - h, w:w, h:h, vx: -randInt(1,3) });
  }
}

// Rendering
function render(){
  // clear
  ctx.clearRect(0,0,W,H);

  // sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#07122a'); g.addColorStop(1,'#071225');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // subtle parallax shapes (hills)
  drawHills();

  // ground
  const gh = groundH();
  ctx.fillStyle = '#0f1720';
  ctx.fillRect(0, H - gh, W, gh);
  // ground stripes
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for(let i = 0; i < W; i += 28) ctx.fillRect(i + ((state.distance|0)%28), H - gh, 18, 2);

  // telegraph markers and shadows (show obstacles far ahead)
  for(const ob of state.obstacles){
    // drop faint shadow/current indicator
    const shadowX = ob.x - (state.speedBase * state.speedMult) * 12 / 2; // approximate travel to reach player
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(Math.round(ob.x), Math.round(ob.y + ob.h + 6), Math.round(ob.w), 6);

    // telegraph: small marker line at top to show far-ahead obstacle (only if far enough)
    if(ob.x > W - state.telegraphDistance + 40){
      const tx = Math.round(ob.x - (W - 140)); // map to near-left indicator region
      // draw indicator above horizon
      ctx.fillStyle = 'rgba(255,80,80,0.08)';
      ctx.fillRect(ob.x - 2, Math.round(ob.y - 28), 4, 18);
    }
  }

  // draw obstacles (main)
  for(const ob of state.obstacles){
    if(ob.type === 'spike'){
      drawSpike(ob);
    } else {
      // shape
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(Math.round(ob.x), Math.round(ob.y), Math.round(ob.w), Math.round(ob.h));
      // highlight
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(Math.round(ob.x + ob.w - Math.min(12, ob.w)), Math.round(ob.y), Math.min(12, ob.w), Math.round(ob.h));
    }
  }

  // player
  ctx.save();
  const rot = Math.max(-0.15, Math.min(0.15, player.vy * 0.02));
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.rotate(rot);
  ctx.fillStyle = player.color;
  roundRect(ctx, -player.w/2, -player.h/2, player.w, player.h, 6, true, false);
  // face
  ctx.fillStyle = '#222';
  ctx.fillRect(-player.w*0.24, -player.h*0.08, player.w*0.18, player.h*0.16);
  ctx.fillRect(player.w*0.06 - player.w/2, -player.h*0.08, player.w*0.18, player.h*0.16);
  ctx.restore();

  // particles
  for(const p of state.particles){
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(12,12,220,58);
  ctx.fillStyle = '#fff';
  ctx.font = `700 ${14 + Math.round(W*0.008)}px system-ui, Arial`;
  ctx.fillText(`Score: ${state.score}`, 24, 36);
  ctx.font = `${12 + Math.round(W*0.006)}px system-ui, Arial`;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(`High: ${state.high}`, 24, 56);

  // game over overlay
  if(state.gameOver){
    ctx.fillStyle = 'rgba(2,6,12,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `800 ${36 + Math.round(W*0.01)}px system-ui, Arial`;
    ctx.fillText('You Crashed', W/2, H/2 - 8);
    ctx.font = `600 ${16 + Math.round(W*0.006)}px system-ui, Arial`;
    ctx.fillStyle = '#d7eef9';
    ctx.fillText(`Score: ${state.score}  •  High: ${state.high}`, W/2, H/2 + 30);
    ctx.font = `500 ${14 + Math.round(W*0.005)}px system-ui, Arial`;
    ctx.fillStyle = '#9fb2c8';
    ctx.fillText('Press R to restart', W/2, H/2 + 66);
    ctx.textAlign = 'start';
  }
}

// helpers
function drawSpike(ob){
  const x = Math.round(ob.x), y = Math.round(ob.y), w = Math.round(ob.w), h = Math.round(ob.h);
  ctx.fillStyle = '#ef4444';
  // draw base rectangle
  ctx.fillRect(x, y + h*0.72, w, h*0.28);
  // draw triangle spikes
  ctx.fillStyle = '#ef4444';
  const spikes = Math.max(2, Math.floor(w / 8));
  const sW = w / spikes;
  ctx.beginPath();
  for(let i=0;i<spikes;i++){
    const sx = x + i * sW;
    ctx.moveTo(sx, y + h*0.72);
    ctx.lineTo(sx + sW*0.5, y);
    ctx.lineTo(sx + sW, y + h*0.72);
  }
  ctx.closePath();
  ctx.fill();
}

function drawHills(){
  const baseY = H - groundH() - 40;
  ctx.fillStyle = 'rgba(6,182,212,0.04)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(let i=0;i<=W;i+=60){
    const peak = baseY - Math.sin((i/150) + (state.distance*0.01)) * 18;
    ctx.lineTo(i, peak);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// rounded rect helper
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  if (typeof r === 'undefined') r = 5;
  if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
  ctx.lineTo(x + r.bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
  ctx.lineTo(x, y + r.tl);
  ctx.quadraticCurveTo(x, y, x + r.tl, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// collision & debug: show telegraph lines (optional)
// start loop
state.lastTime = performance.now();
requestAnimationFrame(loop);

// small UX: if user touches canvas while paused (after crash) restart
canvas.addEventListener('pointerup', ()=>{
  if(state.gameOver) restart();
});

// expose one-time resume audio on first user gesture (some browsers need it)
function unlockAudioOnce(){
  ensureAudio();
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  window.removeEventListener('pointerdown', unlockAudioOnce);
}
window.addEventListener('pointerdown', unlockAudioOnce);

// utility beep on spawn to subtly indicate upcoming obstacle (optional subtle click)
setInterval(()=> {
  if(state.paused || state.gameOver) return;
  // small rhythmic tick based on distance
  state.beat = (state.beat + 1) % 8;
  if(state.beat % 4 === 0) playBeep(600 + Math.random()*120, 0.02);
}, 900);

// convenience: increase speed slightly on double-click for fun
canvas.addEventListener('dblclick', ()=>{ state.speedMult += 0.4; playBeep(800,0.06); });

// On first load show high score in console
console.log('High score:', state.high);
</script>
</body>
</html>
