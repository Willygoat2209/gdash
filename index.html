<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Geometry Dash (HTML + JS)</title>
<style>
  :root{
    --bg: #0f1724;
    --ground: #111827;
    --accent: #06b6d4;
    --danger: #ef4444;
    --cube: #fcd34d;
    --panel: rgba(255,255,255,0.06);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }

  html,body{
    height:100%;
    margin:0;
    background: linear-gradient(180deg, var(--bg) 0%, #07102a 100%);
    color: #e6eef6;
    -webkit-tap-highlight-color: transparent;
  }

  #gameWrap{
    display:flex;
    gap:16px;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
  }

  canvas{
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:10px;
    box-shadow: 0 10px 30px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
    touch-action: none;
  }

  /* HUD / panels */
  .panel{
    width:320px;
    max-width:40vw;
    background:var(--panel);
    padding:14px;
    border-radius:10px;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(2,6,23,0.6);
  }

  .panel h1{
    margin:0 0 8px 0;
    font-size:18px;
    letter-spacing:0.6px;
  }

  .scoreBig{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    font-size:28px;
    color: #fff;
  }

  .small{
    color: #a7b8c9;
    font-size:13px;
    margin-top:8px;
  }

  .buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
  }

  button{
    background:transparent;
    border:1px solid rgba(255,255,255,0.08);
    color:inherit;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
  }

  button.primary{
    background:linear-gradient(90deg,var(--accent), #7dd3fc);
    color:#022;
    border: none;
  }

  .footer{
    margin-top:14px;
    font-size:13px;
    color:#9fb2c8;
  }

  .stat{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:14px;
  }

  .hint{
    margin-top:10px;
    font-size:13px;
    color:#89a7bf;
  }

  @media (max-width:900px){
    #gameWrap{flex-direction:column; align-items:center;}
    .panel{width:92%;}
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="900" height="450" aria-label="Geometry Dash canvas"></canvas>

  <div class="panel" role="region" aria-label="Game controls and stats">
    <h1>Mini Geometry Dash</h1>

    <div class="scoreBig">
      <div>Score: <span id="score">0</span></div>
      <div style="opacity:0.6">|</div>
      <div>High: <span id="high">0</span></div>
    </div>

    <div class="small">Distance: <span id="distance">0</span> m</div>

    <div class="stat"><span>Speed</span><strong id="speed">1.0x</strong></div>
    <div class="stat"><span>Obstacles</span><strong id="obsCount">0</strong></div>

    <div class="buttons">
      <button id="pauseBtn">Pause (P)</button>
      <button id="restartBtn" class="primary">Restart (R)</button>
    </div>

    <div class="hint">Controls: Space / ↑ / W / Click / Tap to jump. P to pause. R to restart.</div>

    <div class="footer">
      <div style="margin-top:10px">Made with HTML5 Canvas — simple clone for practice.</div>
    </div>
  </div>
</div>

<script>
/* Mini Geometry Dash clone
  - Single-file game using canvas
  - Jump physics, obstacles, scrolling, collision
  - LocalStorage for high score
  - Touch and keyboard controls
*/

(() => {
  // Canvas and context
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Responsive canvas sizing (keeps aspect ratio)
  function fitCanvas() {
    const maxWidth = Math.min(window.innerWidth - 48 - 340, 1000); // leave room for HUD
    const w = Math.max(600, maxWidth);
    const aspect = 900/450;
    canvas.width = Math.round(w);
    canvas.height = Math.round(w / aspect);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // HUD elements
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const distEl = document.getElementById('distance');
  const speedEl = document.getElementById('speed');
  const obsEl = document.getElementById('obsCount');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  // Game state
  let gameState = {
    running: true,
    gameOver: false,
    score: 0,
    distance: 0,
    speedMultiplier: 1,
    spawnTimer: 0,
    spawnInterval: 1200, // ms between obstacles (adjusted by speed)
    lastTime: performance.now(),
    obstacles: [],
    high: Number(localStorage.getItem('gd_high') || 0),
    paused: false
  };
  highEl.textContent = gameState.high;

  // Visuals and constants
  const GROUND_HEIGHT = Math.round(canvas.height * 0.12);
  const GRAVITY = 0.0018; // px/ms^2
  const JUMP_VELOCITY = -0.55; // px/ms
  const CUBE_SIZE = Math.round(canvas.height * 0.08);

  // Player
  const player = {
    x: Math.round(canvas.width * 0.15),
    y: canvas.height - GROUND_HEIGHT - CUBE_SIZE,
    w: CUBE_SIZE,
    h: CUBE_SIZE,
    vy: 0,
    grounded: true,
    color: getComputedStyle(document.documentElement).getPropertyValue('--cube').trim() || '#fcd34d'
  };

  // Input
  let input = { jump: false };
  function startJump() {
    if (gameState.gameOver) return;
    if (player.grounded) {
      player.vy = JUMP_VELOCITY;
      player.grounded = false;
    }
  }

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) {
      e.preventDefault();
      startJump();
    } else if (e.key === 'p' || e.key === 'P') {
      togglePause();
    } else if (e.key === 'r' || e.key === 'R') {
      restartGame();
    }
  });

  // Mouse/touch
  canvas.addEventListener('pointerdown', (e) => {
    // prevent context menu-like interactions
    e.preventDefault();
    startJump();
  });

  // Pause and restart buttons
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', restartGame);

  function togglePause() {
    gameState.paused = !gameState.paused;
    pauseBtn.textContent = gameState.paused ? 'Resume (P)' : 'Pause (P)';
    if (!gameState.paused) {
      // reset lastTime so animation doesn't jump
      gameState.lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function restartGame() {
    // Reset state
    gameState.score = 0;
    gameState.distance = 0;
    gameState.speedMultiplier = 1;
    gameState.spawnTimer = 0;
    gameState.spawnInterval = 1200;
    gameState.obstacles = [];
    gameState.gameOver = false;
    player.x = Math.round(canvas.width * 0.15);
    player.y = canvas.height - GROUND_HEIGHT - CUBE_SIZE;
    player.vy = 0;
    player.grounded = true;
    gameState.paused = false;
    pauseBtn.textContent = 'Pause (P)';
    gameState.lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  // Obstacles
  function spawnObstacle() {
    const w = randInt(CUBE_SIZE * 0.6, CUBE_SIZE * 1.6);
    const h = randInt(CUBE_SIZE * 0.6, CUBE_SIZE * 2.2);
    const x = canvas.width + 20;
    const y = canvas.height - GROUND_HEIGHT - h;
    gameState.obstacles.push({ x, y, w, h, hit: false });
  }

  // Utility
  function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  // Collision detection AABB
  function collides(a, b) {
    return !(a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h);
  }

  // Game over handler
  function setGameOver() {
    gameState.gameOver = true;
    gameState.paused = true;
    pauseBtn.textContent = 'Resume (P)';
    if (gameState.score > gameState.high) {
      gameState.high = gameState.score;
      localStorage.setItem('gd_high', String(gameState.high));
      highEl.textContent = gameState.high;
    }
    // small flash effect
    flashScreen();
  }

  function flashScreen() {
    const orig = ctx.fillStyle;
    ctx.fillStyle = 'rgba(255,60,60,0.14)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = orig;
  }

  // Main loop
  function loop(now) {
    if (gameState.paused) return;
    const dt = Math.min(40, now - gameState.lastTime); // clamp delta to avoid huge jumps
    gameState.lastTime = now;

    // increase difficulty gradually
    gameState.speedMultiplier += dt * 0.00008; // speed up slowly
    const speed = 0.45 * gameState.speedMultiplier; // base speed px/ms

    // update spawn interval slightly with speed
    gameState.spawnInterval = 1200 / (1 + (gameState.speedMultiplier - 1) * 0.9);

    // move obstacles
    for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
      const ob = gameState.obstacles[i];
      ob.x -= speed * dt * 100; // convert speed to pixels per dt
      if (ob.x + ob.w < -50) gameState.obstacles.splice(i, 1);
    }

    // spawn logic
    gameState.spawnTimer += dt;
    const spawnEvery = gameState.spawnInterval;
    if (gameState.spawnTimer > spawnEvery) {
      gameState.spawnTimer = 0;
      spawnObstacle();
    }

    // update player physics
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt * 100; // scale vy to pixels per dt

    // ground collision
    const groundY = canvas.height - GROUND_HEIGHT - player.h;
    if (player.y >= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.grounded = true;
    } else {
      player.grounded = false;
    }

    // collisions
    const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (const ob of gameState.obstacles) {
      if (collides(playerRect, ob)) {
        setGameOver();
      }
    }

    // scoring: distance is basically integrated speed
    gameState.distance += speed * dt * 0.08;
    const dist = Math.floor(gameState.distance);
    gameState.score = dist;
    scoreEl.textContent = gameState.score;
    distEl.textContent = dist;
    speedEl.textContent = gameState.speedMultiplier.toFixed(2) + 'x';
    obsEl.textContent = gameState.obstacles.length;

    // draw frame
    render();

    // continue
    if (!gameState.paused) requestAnimationFrame(loop);
  }

  // Rendering
  function render() {
    // background
    ctx.fillStyle = '#081425';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // some parallax hills for depth
    drawParallax();

    // ground
    const gh = GROUND_HEIGHT;
    // top of ground
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground').trim() || '#111827';
    ctx.fillRect(0, canvas.height - gh, canvas.width, gh);

    // ground pattern
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let i = 0; i < canvas.width; i += 30) {
      ctx.fillRect(i, canvas.height - gh, 20, 2);
    }

    // obstacles
    for (const ob of gameState.obstacles) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#ef4444';
      ctx.fillRect(Math.round(ob.x), Math.round(ob.y), Math.round(ob.w), Math.round(ob.h));
      // small highlight
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(Math.round(ob.x + ob.w - Math.min(12, ob.w)), Math.round(ob.y), Math.min(12, ob.w), Math.round(ob.h));
    }

    // player (cube)
    ctx.save();
    // slight rotation based on vertical velocity for flair
    const rot = Math.max(-0.15, Math.min(0.15, player.vy * 0.8));
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(rot);
    ctx.fillStyle = player.color;
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    // face (simple)
    ctx.fillStyle = '#222';
    ctx.fillRect(-player.w*0.24, -player.h*0.08, player.w*0.18, player.h*0.16);
    ctx.fillRect(player.w*0.06 - player.w/2, -player.h*0.08, player.w*0.18, player.h*0.16);
    ctx.restore();

    // top-left HUD overlay on canvas
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(14, 14, 220, 46);
    ctx.fillStyle = '#fff';
    ctx.font = `600 ${14 + Math.round(canvas.width * 0.008)}px system-ui, Arial`;
    ctx.fillText(`Score: ${gameState.score}`, 24, 36);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `500 ${12 + Math.round(canvas.width * 0.006)}px system-ui, Arial`;
    ctx.fillText(`High: ${gameState.high}`, 24, 54);

    // if game over overlay
    if (gameState.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = `700 ${28 + Math.round(canvas.width * 0.01)}px system-ui, Arial`;
      ctx.fillText('You Crashed', canvas.width/2, canvas.height/2 - 10);

      ctx.font = `600 ${16 + Math.round(canvas.width * 0.006)}px system-ui, Arial`;
      ctx.fillStyle = '#d9eefa';
      ctx.fillText(`Score: ${gameState.score}  •  High: ${gameState.high}`, canvas.width/2, canvas.height/2 + 28);

      ctx.font = `500 ${14 + Math.round(canvas.width * 0.005)}px system-ui, Arial`;
      ctx.fillStyle = '#9fb2c8';
      ctx.fillText('Press R to restart', canvas.width/2, canvas.height/2 + 64);
      ctx.textAlign = 'start';
    }
  }

  // Parallax background (simple)
  function drawParallax(){
    // sky stripe
    const w = canvas.width, h = canvas.height;
    // distant mountains
    const baseY = h - GROUND_HEIGHT - 60;
    ctx.fillStyle = 'rgba(6,182,212,0.06)';
    ctx.beginPath();
    ctx.moveTo(0, baseY+40);
    for (let i=0;i<w;i+=60){
      const peak = baseY - (Math.sin((i/80)+gameState.distance*0.01) * (12 + (gameState.speedMultiplier*3)));
      ctx.lineTo(i, peak + (i%120===0?20:0));
    }
    ctx.lineTo(w, baseY+40);
    ctx.closePath();
    ctx.fill();

    // moving grid lines (gives illusion of forward motion)
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const speed = 0.45 * gameState.speedMultiplier * 30;
    for (let x = -((gameState.distance * 0.6) % 40); x < w; x += 40) {
      ctx.moveTo(x, h - GROUND_HEIGHT - 4);
      ctx.lineTo(x, h - GROUND_HEIGHT - 40);
    }
    ctx.stroke();
  }

  // Start initial obstacles (a couple for immediate gameplay)
  for (let i = 0; i < 2; i++) spawnObstacle();

  // Kick off
  gameState.lastTime = performance.now();
  requestAnimationFrame(loop);

  // expose a tiny debug on double-click: skip forward speed
  canvas.addEventListener('dblclick', () => {
    gameState.speedMultiplier += 0.5;
  });

  // Accessibility: show text high score on load
  highEl.textContent = gameState.high;

})();
</script>
</body>
</html>
