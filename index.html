<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash Custom</title>
<style>
    body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
    canvas { display:block; background:black; }
    #menu {
        position:absolute; inset:0;
        display:flex; flex-direction:column;
        justify-content:center; align-items:center;
        background:linear-gradient(135deg,#0ff,#80f,#f0f);
        color:white; text-align:center;
    }
    .btn {
        background:white; color:#000; padding:15px 30px;
        margin:12px; border-radius:10px;
        cursor:pointer; font-size:24px;
        font-weight:bold; transition:0.2s;
    }
    .btn:hover { transform:scale(1.1); }
    h1 { font-size:60px; margin-bottom:20px; }
</style>
</head>
<body>

<div id="menu">
    <h1>GEOMETRY DASH</h1>
    <div class="btn" onclick="startLevel(1)">Level 1 — Neon Run</div>
    <div class="btn" onclick="startLevel(2)">Level 2 — Cosmic Chaos</div>
    <div class="btn" onclick="startLevel(3)">Level 3 — Rainbow Rush</div>
</div>

<canvas id="game" width="900" height="450"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Scenes
let onMenu = true;
let level = 1;

// Player
let player = { x:120, y:330, w:45, h:45, vy:0, gravity:0.75, jump:-14, holding:false };

// Obstacles
let obstacles = [];
let speed = 7;

// Colors for each level
const levelColors = {
  1: ["#00eaff","#00ffaa","#0099ff","#22ffcc"],
  2: ["#ff008c","#ff7000","#ff00e1","#ff2f56"],
  3: ["#ff0000","#ff8800","#ffee00","#00ff00","#00bbff","#7700ff"]
};

// Spawning patterns for each level
const levelPatterns = {
  1: [ "spike", "double", "block" ],
  2: [ "spike", "upsidedown", "tallblock", "double" ],
  3: [ "spike", "double", "quad", "rainbow" ]
};

// Background gradient animation
let bgShift = 0;

// Start level
function startLevel(lv) {
  document.getElementById("menu").style.display = "none";
  level = lv;
  onMenu = false;
  resetGame();
}

function resetGame() {
  player.y = 330;
  player.vy = 0;
  obstacles = [];
  speed = 7 + level;
  spawnLoop();
  update();
}

// Jump hold = bounce
document.addEventListener("keydown", e=>{
  if(e.code === "Space") player.holding = true;
});
document.addEventListener("keyup", e=>{
  if(e.code === "Space") player.holding = false;
});

// Create obstacles
function spawnObstacle() {
  let type = randomChoice(levelPatterns[level]);
  let color = randomChoice(levelColors[level]);

  let obs = {
    x: canvas.width + 50,
    y: 330,
    w: 50, h:50,
    type: type,
    color: color
  };

  if (type === "tallblock") obs.h = 120;
  if (type === "upsidedown") obs.y = 280;
  if (type === "quad") { obs.w = 40; obs.h = 40; obs.quad = true; }
  
  obstacles.push(obs);
}

function spawnLoop() {
  if(onMenu) return;
  spawnObstacle();
  setTimeout(spawnLoop, 900 - level * 120);
}

// Random pick
function randomChoice(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

// Draw spike obstacle
function drawSpike(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(o.x, o.y + o.h);
  ctx.lineTo(o.x + o.w/2, o.y);
  ctx.lineTo(o.x + o.w, o.y + o.h);
  ctx.closePath();
  ctx.fill();
}

function drawUpsideDownSpike(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(o.x, o.y);
  ctx.lineTo(o.x + o.w/2, o.y + o.h);
  ctx.lineTo(o.x + o.w, o.y);
  ctx.closePath();
  ctx.fill();
}

// Main update loop
function update() {
  if(onMenu) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background gradient
  bgShift += 0.005;
  let col1 = levelColors[level][Math.floor(bgShift % levelColors[level].length)];
  let col2 = levelColors[level][Math.floor((bgShift+1) % levelColors[level].length)];
  let g = ctx.createLinearGradient(0,0,900,450);
  g.addColorStop(0,col1);
  g.addColorStop(1,col2);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,900,450);

  // Ground
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(0,380,900,80);

  // Bounce jump
  if(player.holding && player.y >= 330){
    player.vy = player.jump;
  }

  // Gravity
  player.vy += player.gravity;
  player.y += player.vy;

  // Ground collision
  if(player.y > 330){
    player.y = 330;
    player.vy = 0;
  }

  // Draw player (rotating cube)
  ctx.save();
  ctx.translate(player.x+player.w/2, player.y+player.h/2);
  if(!player.holding) ctx.rotate(player.vy/10);
  ctx.fillStyle = "#fff";
  ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
  ctx.restore();

  // Move & draw obstacles
  for(let o of obstacles){
    o.x -= speed;

    if(o.type==="spike") drawSpike(o);
    else if(o.type==="upsidedown") drawUpsideDownSpike(o);
    else if(o.type==="double"){
      drawSpike(o);
      ctx.save();
      ctx.translate(0,-50);
      drawSpike(o);
      ctx.restore();
    }
    else if(o.type==="block"||o.type==="tallblock"){
      ctx.fillStyle = o.color;
      ctx.fillRect(o.x,o.y,o.w,o.h);
    }
    else if(o.type==="quad"){
      for(let i=0;i<4;i++){
        ctx.fillStyle = levelColors[level][i % levelColors[level].length];
        ctx.fillRect(o.x + (i%2)*40, o.y - Math.floor(i/2)*40, 40, 40);
      }
    }

    // Collision
    if(player.x < o.x + o.w &&
       player.x + player.w > o.x &&
       player.y < o.y + o.h &&
       player.y + player.h > o.y){
         location.reload();
       }
  }

  requestAnimationFrame(update);
}
</script>

</body>
</html>
